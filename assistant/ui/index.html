<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Manu — Personal Assistant</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="title">🪷 Manu <span class="sub">your private offline assistant</span></div>
    <div class="header-right">
      <span id="health" class="health">checking…</span>
      <button id="upcomingBtn" class="secondary" title="Commitments with due dates, extracted from your conversations">Upcoming</button>
      <button id="peopleBtn" class="secondary" title="People in your conversations and what Manu knows about them">People</button>
      <button id="digestBtn" class="secondary" title="A summary of your last 7 days">Digest</button>
      <button id="ingestBtn" title="Process new files dropped into the ingest/ folders">Process new files</button>
    </div>
  </header>

  <div id="ingestPanel" class="hidden">
    <div id="ingestLog"></div>
  </div>

  <div id="infoPanel" class="hidden">
    <div id="infoContent"></div>
    <button id="infoClose" class="secondary">Close</button>
  </div>

  <main id="chat">
    <div class="msg assistant">
      <div class="bubble">नमस्कार! 🙏 Drop your call recordings, WhatsApp exports and SMS backups
      into the <b>ingest</b> folders, press <b>Process new files</b>, and then ask me anything
      about your life — Marathi, Hindi, or English, जसं तुम्हाला सोयीचं वाटेल.</div>
    </div>
  </main>

  <footer>
    <textarea id="input" rows="1" placeholder="Ask me anything… / काहीही विचारा…"></textarea>
    <button id="sendBtn">Send</button>
  </footer>
</div>
<script src="/ui/app.js"></script>
</body>
</html>
